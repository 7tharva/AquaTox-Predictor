<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}AquaTox{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f8f9fb;
      --surface:   #ffffff;
      --border:    #e4e7ec;
      --text:      #1a1d23;
      --muted:     #6b7280;
      --accent:    #0ea5e9;
      --accent-dk: #0284c7;
      --green:     #10b981;
      --red:       #ef4444;
      --yellow:    #f59e0b;
      --radius:    10px;
      --shadow:    0 1px 3px rgba(0,0,0,0.07), 0 4px 12px rgba(0,0,0,0.04);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAV */
    nav {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-brand {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .nav-brand span { color: var(--text); }
    .nav-links { display: flex; gap: 0.25rem; }
    .nav-links a {
      text-decoration: none;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      transition: all 0.15s;
    }
    .nav-links a:hover { background: var(--bg); color: var(--text); }
    .nav-links a.active { background: var(--accent); color: white; }

    /* MAIN */
    main {
      flex: 1;
      padding: 2.5rem 2rem;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      position: relative;
      z-index: 1;
      background: transparent;
    }

    /* WHITE BACKDROP on content blocks only */
    .hero-section,
    .stats-strip,
    .page-header,
    .input-card,
    .result-card,
    .placeholder-card,
    .about-card,
    .limit-card,
    .model-card,
    .feature-card,
    .cta-section,
    .pipeline-steps {
      background: rgba(248, 249, 251, 0.92) !important;
      border-radius: 14px;
    }

    .section,
    .about-section {
      background: transparent;
    }

    .stats-strip {
      overflow: hidden;
      padding: 0 !important;
    }

    /* CARD */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem;
    }

    /* BADGE */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-green  { background: #d1fae5; color: #065f46; }
    .badge-red    { background: #fee2e2; color: #991b1b; }
    .badge-yellow { background: #fef3c7; color: #92400e; }
    .badge-blue   { background: #dbeafe; color: #1e40af; }

    /* BUTTON */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
      text-decoration: none;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-dk); }
    .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

    /* SECTION TITLE */
    .section-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 1.25rem;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: rgba(255,255,255,0.95);
      position: relative;
      z-index: 1;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

  <!-- Background canvas — AquaTox repel effect -->
  <canvas id="bg-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:0.18"></canvas>

  <nav>
    <a class="nav-brand" href="/">🧪 <span>AquaTox</span> Predictor</a>
    <div class="nav-links">
      <a href="/" class="{% if request.path == '/' %}active{% endif %}">Home</a>
      <a href="/predict" class="{% if request.path == '/predict' %}active{% endif %}">Predict</a>
      <a href="/about" class="{% if request.path == '/about' %}active{% endif %}">About</a>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    AquaTox Predictor &mdash; ENGG2112 &mdash; t-F2F Challenge &mdash; Built with Flask + scikit-learn
  </footer>

  <script>
    const canvas = document.getElementById('bg-canvas');
    const ctx    = canvas.getContext('2d');

    let W = canvas.width  = window.innerWidth;
    let H = canvas.height = window.innerHeight;
    let mouse   = { x: -999, y: -999 };
    let ripples = [];

    const WORD         = 'AquaTox';
    const REPEL_RADIUS = 120;
    const REPEL_FORCE  = 0.55;
    const SPRING       = 0.08;
    const DAMPING      = 0.75;

    let particles = [];

    function buildGrid() {
      particles = [];
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
      const cols = Math.ceil(W / 130) + 1;
      const rows = Math.ceil(H / 60)  + 2;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const ox = c * 130 + (r % 2 === 0 ? 0 : 65);
          const oy = r * 60;
          particles.push({ ox, oy, x: ox, y: oy, vx: 0, vy: 0 });
        }
      }
    }
    buildGrid();
    window.addEventListener('resize', buildGrid);

    document.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    document.addEventListener('click', e => {
      ripples.push({ x: e.clientX, y: e.clientY, r: 0, alpha: 1 });
    });

    function animate() {
      ctx.clearRect(0, 0, W, H);

      ripples = ripples.filter(rp => rp.alpha > 0.01);
      ripples.forEach(rp => {
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(14,165,233,${rp.alpha})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(rp.x, rp.y, rp.r * 0.6, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(14,165,233,${rp.alpha * 0.5})`;
        ctx.lineWidth = 1;
        ctx.stroke();

        rp.r     += 4;
        rp.alpha *= 0.94;
      });

      ctx.font         = '500 13px Inter, sans-serif';
      ctx.fillStyle    = '#0ea5e9';
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';

      const scrollY = window.scrollY;

      particles.forEach(p => {
        const vpY = p.y - scrollY;
        if (vpY < -60 || vpY > H + 60) return;

        const dx   = p.x - mouse.x;
        const dy   = vpY  - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < REPEL_RADIUS && dist > 0) {
          const force = (REPEL_RADIUS - dist) / REPEL_RADIUS;
          p.vx += (dx / dist) * force * REPEL_FORCE * 8;
          p.vy += (dy / dist) * force * REPEL_FORCE * 8;
        }

        ripples.forEach(rp => {
          const rdx   = p.x  - rp.x;
          const rdy   = vpY  - rp.y;
          const rdist = Math.sqrt(rdx * rdx + rdy * rdy);
          const ring  = Math.abs(rdist - rp.r);
          if (ring < 40 && rdist > 0) {
            const force = (40 - ring) / 40 * rp.alpha;
            p.vx += (rdx / rdist) * force * 3;
            p.vy += (rdy / rdist) * force * 3;
          }
        });

        p.vx += (p.ox - p.x) * SPRING;
        p.vy += (p.oy - p.y) * SPRING;
        p.vx *= DAMPING;
        p.vy *= DAMPING;
        p.x  += p.vx;
        p.y  += p.vy;

        const stretch   = Math.sqrt((p.x - p.ox) ** 2 + (p.y - p.oy) ** 2);
        ctx.globalAlpha = Math.max(0.3, 1 - stretch / 80);
        ctx.fillText(WORD, p.x, vpY);
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(animate);
    }
    animate();
  </script>

</body>
</html>
